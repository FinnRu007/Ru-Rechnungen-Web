name: SEO-GEO-Check Test
# Prüft das Werkzeug /webseiten/seo-geo-check/ mit echten Webseiten.
# Läuft nur von Hand (Actions, "Run workflow") und bei Änderungen am Werkzeug.
on:
  workflow_dispatch:
  push:
    paths:
      - 'webseiten/seo-geo-check/**'
      - 'tests/seo-geo-check.e2e.js'
      - '.github/workflows/seo-check-test.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Playwright installieren
        run: |
          npm install --no-save playwright@1.48.2
          npx playwright install --with-deps chromium
      - name: Werkzeug mit echten Seiten testen
        run: node tests/seo-geo-check.e2e.js test-ergebnisse
      - name: Screenshots sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-geo-check-test
          path: test-ergebnisse
          retention-days: 1
      - name: Screenshots für die Abnahme auf eigenen Zweig legen
        if: github.event_name == 'workflow_dispatch'
        run: |
          cd test-ergebnisse
          git init -q && git checkout -q -b seo-geo-check-bilder
          git -c user.name=ci -c user.email=ci@localhost add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "Screenshots"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" seo-geo-check-bilder
